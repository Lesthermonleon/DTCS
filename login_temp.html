<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DITC HMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f2042 0%, #1565c0 60%, #0288d1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            width: 100%;
            max-width: 420px;
            background: #fff;
        }
        .auth-header {
            background: linear-gradient(135deg, #0f2042, #1565c0);
            border-radius: 1.25rem 1.25rem 0 0;
            padding: 2rem;
            text-align: center;
            color: #fff;
        }
        .auth-header h3 { font-weight: 700; margin: .5rem 0 .2rem; }
        .auth-header p  { opacity: .75; font-size: .85rem; margin: 0; }
        .auth-body { padding: 2rem; }
        .form-control, .form-select {
            border-radius: .6rem;
            border-color: #e2e8f0;
            padding: .6rem 1rem;
            font-size: .9rem;
        }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(21,101,192,.15); border-color: #1565c0; }
        .btn-primary {
            background: linear-gradient(135deg, #1565c0, #0288d1);
            border: none;
            border-radius: .6rem;
            padding: .7rem;
            font-weight: 600;
        }
        .btn-primary:hover { opacity: .9; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <i class="bi bi-hospital2 display-6"></i>
            <h3>DITC HMS</h3>
            <p>Diagnostic, Treatment &amp; Clinical Services</p>
        </div>
        <div class="auth-body">
            
    
    
    <form method="POST" action="http://127.0.0.1:8000/login">
        <input type="hidden" name="_token" value="8Gh20W3RYLC97M2J25Hq7Z28EEhskIsldvaseObJ" autocomplete="off">
        
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input id="email" type="email" name="email"
                       class="form-control border-start-0 ps-0 "
                       value="" required autofocus autocomplete="username"
                       placeholder="you@hospital.com">
                            </div>
        </div>

        
        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input id="password" type="password" name="password"
                       class="form-control border-start-0 ps-0 "
                       required autocomplete="current-password" placeholder="••••••••">
                            </div>
        </div>

        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="remember" id="remember_me">
                <label class="form-check-label small text-muted" for="remember_me">Remember me</label>
            </div>
                            <a href="http://127.0.0.1:8000/forgot-password" class="small text-primary text-decoration-none">
                    Forgot password?
                </a>
                    </div>

        
        <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
